[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "photosmetadata"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6.0",
    "pyexiftool>=0.5.6",
    "python-dateutil>=2.9.0",
    "Pillow>=10.3.0",
]

[project.scripts]
photosmetadata = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_exiftool: marks tests that need ExifTool installed",
]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["tests/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
